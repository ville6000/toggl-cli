# Builds the release binaries when a GitHub release is published; see
# .github/workflows/release.yml. Check locally with `goreleaser check` and
# `goreleaser release --snapshot --clean`.
version: 2

project_name: toggl-cli

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ville6000/toggl-cli/cmd.version={{ .Version }}

archives:
  # No version in the name, so the README can link to
  # releases/latest/download/<name> for whichever release is newest.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/*.md

checksum:
  name_template: checksums.txt

# Release notes are written on GitHub when the release is published; only
# attach the binaries.
changelog:
  disable: true

release:
  mode: keep-existing

# Publishes Casks/toggl-cli.rb to ville6000/homebrew-tap, so
# `brew install ville6000/tap/toggl-cli` works. HOMEBREW_TAP_TOKEN is a
# fine-grained PAT with contents write access to that repo.
homebrew_casks:
  - repository:
      owner: ville6000
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/ville6000/toggl-cli
    description: Command line client for Toggl Track
    license: MIT
    # The binaries aren't signed, so remove the quarantine attribute that
    # would make Gatekeeper block the first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/toggl-cli"]
          end
